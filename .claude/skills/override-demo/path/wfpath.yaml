schema_version: "0.1"

slug: override-demo
name: "Override Demo"
version: "1.0.1"

primary_kind: monitor
tags:
  - monitor

components:
  - id: "main"
    kind: script
    path: "scripts/main.py"

skill:
  enabled: true
  source: generated
  name: "override-demo"
  description: "Use the override-demo path through Wayfinder."
  instructions: "skill/instructions.md"
  runtime:
    mode: thin
    package: "wayfinder-paths"
    version: "0.11.1"
    python: ">=3.12,<3.13"
    component: "main"
    bootstrap: uv
    fallback_bootstrap: pipx
    prefer_existing_runtime: true
    require_api_key: false
    api_key_env: "WAYFINDER_API_KEY"
    config_path_env: "WAYFINDER_CONFIG_PATH"
